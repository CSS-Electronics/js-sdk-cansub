<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CANsub App - Filtered Trace</title>
  <link rel="icon" type="image/png" href="../../shared/favicon.png" />
</head>
<body>
  <div class="cs-app">
    <aside id="sidebar"></aside>
    <main class="cs-main">
      <h1>Filtered trace</h1>
      <p class="cs-subtitle">The newest frames across all connected channels, sorted by time. Pick the CAN IDs to show in the sidebar.</p>
      <div class="cs-table-wrap">
        <table class="cs-table">
          <thead><tr><th>Time</th><th>Bus</th><th>ID</th><th>Dir</th><th>Len</th><th>Data</th></tr></thead>
          <tbody id="frame-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
