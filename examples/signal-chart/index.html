<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CANsub App - Live Signal Chart</title>
  <link rel="icon" type="image/png" href="../../shared/favicon.png" />
</head>
<body>
  <div class="cs-app">
    <aside id="sidebar"></aside>
    <main class="cs-main">
      <h1>Live signal chart</h1>
      <p class="cs-subtitle">Decode signals with DBC files and plot them live. Pick up to 8 signals in the sidebar.</p>
      <div class="cs-stats"><div>Frames: <b id="frame-count">0</b></div></div>
      <div id="chart" class="cs-card"></div>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
