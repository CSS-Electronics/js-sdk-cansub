<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CANsub App - Starter</title>
  <link rel="icon" type="image/png" href="../../shared/favicon.png" />
</head>
<body>
  <div class="cs-app">
    <aside id="sidebar"></aside>
    <main class="cs-main">
      <h1>Starter</h1>
      <p class="cs-subtitle">Open your CANsub, connect a channel and pick signals in the sidebar. Their latest values show below. Copy this folder to start your own app.</p>
      <div class="cs-stats">
        <div>Frames: <b id="frame-count">0</b></div>
        <div>Signals seen: <b id="signal-count">0</b></div>
      </div>
      <div class="cs-table-wrap">
        <table class="cs-table">
          <thead><tr><th>Signal</th><th>Value</th><th>Unit</th></tr></thead>
          <tbody id="values"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
